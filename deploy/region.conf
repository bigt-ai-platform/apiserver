# deploy/region.conf — apiserver regional deployment map (sourced by region.sh).
#
# A region = one VM running the apiserver relay (systemd, Node) behind the
# host Caddy TLS gateway, analog ../wallet/deploy/region.conf and
# ../dai/deploy/region.conf — same fleet, same SSH keys, no docker image
# (the relay is a small Node service: git archive → npm ci → systemd).
#
# Current fleet:
#   s1002  s1002.bigt.ai = 92.5.34.128   (behind jump root@85.214.37.95,
#                                          seeds-registry host; SSH as ubuntu)
#
# Deploy:
#   ALLOW_IPS=<member-cidrs> ./deploy.sh
#   ALLOW_IPS=<member-cidrs> ./deploy.sh --caddy   # + write the TLS vhost

# ─── Regions ───
REGIONS=(
  s1002
)

# Public domain Caddy serves for this region (TLS vhost). s1002.bigta.ai must
# resolve to the VM (A → 92.5.34.128) before ACME can issue; use
# CADDY_TLS_MODE=internal for a raw-IP cert until DNS exists.
declare -A REGION_DOMAIN
REGION_DOMAIN[s1002]="s1002.bigta.ai"

# SSH target (DNS name or IP). s1002 is only reachable via JUMP_HOST.
declare -A REGION_VM
REGION_VM[s1002]="s1002.bigt.ai"

declare -A REGION_SSH_USER
REGION_SSH_USER[s1002]="ubuntu"

declare -A REGION_SSH_KEY
REGION_SSH_KEY[s1002]="${HOME}/.ssh/oraclevpc.key"

# Jump host for VMs not directly reachable (s1002 lives behind s1001; the
# jump connection itself uses your ~/.ssh/config — see ~/.ssh/config
# "Host 92.5.34.128" / oraclevpc.key). Empty = direct SSH.
JUMP_HOST="${JUMP_HOST:-root@85.214.37.95}"

# ─── Install layout on the VM ───
# Working dir: source (git archive) + node_modules + dist + .env + systemd unit.
REMOTE_REPO="${REMOTE_REPO:-/home/ubuntu/apiserver}"
SERVICE_NAME="${SERVICE_NAME:-apiserver}"

# Relay bind (loopback — only Caddy reaches it).
RELAY_PORT="${RELAY_PORT:-8080}"

# Node major to install if missing (NodeSource apt).
NODE_MAJOR="${NODE_MAJOR:-20}"

# ─── Relay policy (written to .env on the VM) ───
# ALLOW_IPS is REQUIRED at deploy time (empty = open relay). Pass per deploy:
#   ALLOW_IPS="203.0.113.7,10.9.0.0/16" ./deploy.sh
# or fill in here for a fixed group.
ALLOW_IPS="${ALLOW_IPS:-}"

# Opt-in escape hatch for a throwaway lab only.
ALLOW_ALL="${ALLOW_ALL:-0}"

# Chain upstreams (prod public nodes by default; point at a colocated node
# when the region runs its own chain).
L0_UPSTREAMS="${L0_UPSTREAMS:-https://eu1.bigtangle.org,https://eu2.bigtangle.org,https://eu3.bigtangle.org}"
L1_UPSTREAMS="${L1_UPSTREAMS:-https://ordereu1.bigtangle.org,https://ordereu2.bigtangle.org,https://ordereu3.bigtangle.org}"
UPSTREAM_TIMEOUT_MS="${UPSTREAM_TIMEOUT_MS:-15000}"
ALLOW_WRITES="${ALLOW_WRITES:-1}"

# Optional dai role proxy (empty = those routes 404 — chain-replay only).
AUTH_URL="${AUTH_URL:-}"
GATEWAY_URL="${GATEWAY_URL:-}"
INDEXER_URL="${INDEXER_URL:-}"
FEED_URL="${FEED_URL:-}"
DAI_URL="${DAI_URL:-}"

# ─── Caddy vhost (deploy.sh --caddy) ───
# acme   = public Let's Encrypt (needs DNS → VM)
# internal = Caddy local-CA cert for the raw IP / name (SDK clients accept it)
CADDY_TLS_MODE="${CADDY_TLS_MODE:-acme}"
CADDY_SITES_DIR="${CADDY_SITES_DIR:-/etc/caddy/Caddyfile.d}"
